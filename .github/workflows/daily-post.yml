name: Daily story

on:
  schedule:
    # 01:30 UTC = 07:30 Asia/Dhaka (UTC+6, no daylight saving).
    # The story is written, hosted, then scheduled in Buffer for 09:00 Dhaka.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview only, or preview and schedule in Buffer"
        type: choice
        options: [preview, publish]
        default: preview
      date:
        description: "optional run date (YYYY-MM-DD); empty means today in Dhaka"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      BUFFER_CHANNEL_FB: ${{ vars.BUFFER_CHANNEL_FB }}
      BUFFER_CHANNELS: ${{ vars.BUFFER_CHANNELS || 'facebook' }}
      ENABLE_QUEUEING: ${{ vars.ENABLE_QUEUEING }}
      STORY_LOCAL_TIME: ${{ vars.STORY_LOCAL_TIME || '09:00' }}
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'true' }}
    steps:
      - name: Check the pause switch
        id: gate
        run: |
          if [ "$AUTOMATION_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Automation is paused (AUTOMATION_ENABLED=$AUTOMATION_ENABLED)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure fonts
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-bengali fonts-dejavu-core

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pip install -r requirements-dev.txt

      - name: Test
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pytest -q

      - name: Write the story
        if: steps.gate.outputs.enabled == 'true'
        run: |
          args="--mode preview --story --out out"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            args="$args --date ${{ github.event.inputs.date }}"
          fi
          python -m src.main $args

      - name: Upload preview
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-story-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: warn

      - name: Read preview metadata
        if: steps.gate.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          directories = sorted(p for p in Path("out").iterdir() if p.is_dir())
          if not directories:
              raise SystemExit("no preview directory in out/")
          latest = directories[-1]
          post = json.loads((latest / "post.json").read_text(encoding="utf-8"))
          if post.get("status") != "PREVIEW READY":
              raise SystemExit(f"preview status is {post.get('status')!r}, expected 'PREVIEW READY'")
          print(f"date={latest.name}")
          print(f"post_id={post['post_id']}")
          PY

      - name: Publish the image for the raw URL
        if: steps.gate.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
        run: |
          set -e
          mkdir -p docs/posts
          cp "out/${{ steps.meta.outputs.date }}/image.png" "docs/posts/${{ steps.meta.outputs.post_id }}.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/posts/${{ steps.meta.outputs.post_id }}.png"
          if git diff --cached --quiet; then
            echo "image already committed"
            exit 0
          fi
          git commit -m "chore: host image for ${{ steps.meta.outputs.post_id }}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "image pushed"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Image not pushed::The run finished but the image could not be pushed."
          exit 1

      - name: Schedule in Buffer
        if: steps.gate.outputs.enabled == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
        run: |
          image_url="https://raw.githubusercontent.com/${{ github.repository }}/main/docs/posts/${{ steps.meta.outputs.post_id }}.png"
          echo "public image: $image_url"
          set +e
          python -m src.main --mode queue \
            --date "${{ steps.meta.outputs.date }}" \
            --out out \
            --image-url "$image_url" \
            --due-local "$STORY_LOCAL_TIME"
          code=$?
          if [ "$code" -ne 0 ]; then
            if grep -q "Status:\*\* SKIPPED" "out/${{ steps.meta.outputs.date }}/report.md"; then
              echo "Already posted for ${{ steps.meta.outputs.date }}; nothing to do."
              exit 0
            fi
            exit "$code"
          fi

      - name: Commit the ledger and history
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          changed=0
          for path in state/ledger.jsonl state/story_history.json; do
            if [ -f "$path" ] && [ -n "$(git status --porcelain -- "$path")" ]; then
              changed=1
            fi
          done
          if [ "$changed" != "1" ]; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ledger.jsonl state/story_history.json
          git commit -m "chore: update post state"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "state pushed"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=State not pushed::The run finished but the ledger could not be pushed."
          exit 1
